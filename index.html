<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杨梅的家庭手账菜单 💕</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { hand: ['"Ma Shan Zheng"', 'cursive'], zcool: ['"ZCOOL KuaiLe"', 'sans-serif'] },
      colors: { cream: '#FFF7F1', berry: '#E67A7A', peach: '#FFD9C0', lemon: '#FFF4B8', pinkpaper: '#FFEEF2', ink: '#5B4652' }
    }
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  body {
    background: #FFEEF2;
    background-image: radial-gradient(circle at 10% 20%, #FFD1E0 0 8%, transparent 9%), radial-gradient(circle at 80% 10%, #FFF4B8 0 10%, transparent 11%), radial-gradient(circle at 70% 80%, #FFD9C0 0 9%, transparent 10%), repeating-linear-gradient(#FFE0EC 0 1px, transparent 1px 34px);
    color: #5B4652; font-family: 'ZCOOL KuaiLe', sans-serif;
  }
  .notebook { background: rgba(255, 247, 241, 0.92); border: 3px dashed #E6A5B8; border-radius: 18px; box-shadow: 0 10px 30px rgba(230, 122, 122, 0.15); position: relative; padding: 24px 18px; }
  .notebook::before { content: "💕"; position: absolute; top: -14px; left: 18px; background: #FFD1E0; padding: 4px 10px; border-radius: 12px; font-size: 14px; border: 2px solid #fff; }
  .tape-card { position: relative; background: #fffbf6; border: 2px solid #F2C4CE; border-radius: 14px; box-shadow: 0 6px 14px rgba(230, 122, 122, 0.12); padding: 18px; }
  .tape { position: absolute; top: -14px; left: 50%; transform: translateX(-50%) rotate(-3deg); background: #FFD1E0; color: #fff; padding: 4px 14px; border-radius: 10px; font-size: 13px; letter-spacing: 1px; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(230, 122, 122, 0.25); }
  .tape.strawberry { background: #E67A7A; } .tape.lemon { background: #F2D166; } .tape.peach { background: #FFBFA3; }
  .sticker-tag { display: inline-block; padding: 3px 10px; border-radius: 10px; font-family: 'Ma Shan Zheng', cursive; background: #FFD1E0; color: #fff; transform: rotate(-2deg); box-shadow: 0 2px 4px rgba(230, 122, 122, 0.25); margin-right: 6px; margin-bottom: 4px; }
  .sticker-tag.peach { background: #FFBFA3; } .sticker-tag.lemon { background: #F2D166; color: #7a5b30; } .sticker-tag.berry { background: #E67A7A; }
  .heart-title { font-family: 'Ma Shan Zheng', cursive; background: linear-gradient(90deg, #E67A7A, #FFBFA3); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .btn-cute { background: linear-gradient(180deg, #FFD1E0, #FFB6C8); color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 10px 18px; box-shadow: 0 4px 10px rgba(230, 122, 122, 0.3); transition: transform .15s ease; }
  .btn-cute:hover { transform: translateY(-2px) scale(1.03); }
  .btn-soft { background: #FFF4B8; color: #7a5b30; border: 2px solid #fff; border-radius: 999px; padding: 8px 14px; box-shadow: 0 3px 8px rgba(242, 209, 102, 0.35); }
  .btn-pink { background: #FFB6C8; color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 8px 14px; }
  input, textarea, select { background: #fff; border: 2px dashed #F2C4CE; border-radius: 12px; padding: 10px 12px; font-family: 'ZCOOL KuaiLe', sans-serif; color: #5B4652; width: 100%; }
  .recipe-card { background: #fff; border: 2px solid #FFD1E0; border-radius: 16px; padding: 14px; box-shadow: 0 6px 14px rgba(230, 122, 122, 0.12); position: relative; overflow: hidden; }
  .recipe-card::before { content: "♡"; position: absolute; top: 10px; right: 12px; color: #FFB6C8; font-size: 22px; }
  .recipe-img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(230, 122, 122, 0.18); }
  .tab-btn { background: #fff; border: 2px solid #F2C4CE; border-radius: 999px; padding: 8px 14px; color: #5B4652; }
  .tab-btn.active { background: #FFD1E0; color: #fff; border-color: #FFB6C8; }
  .hand-border { border: 2px dashed #E6A5B8; border-radius: 16px; background: #FFFAF2; padding: 16px; }
  .tip-bubble { background: #FFF4B8; border-radius: 14px; padding: 10px 14px; color: #7a5b30; position: relative; }
  .heart-divider { text-align: center; color: #FFB6C8; font-size: 20px; margin: 14px 0; letter-spacing: 4px; }
  .qty-btn { width: 32px; height: 32px; border-radius: 50%; background: #FFD1E0; color: #E67A7A; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(230, 122, 122, 0.2); cursor: pointer; }
  .qty-btn:active { transform: scale(0.95); }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #FFB6C8; border-radius: 4px; }
</style>
</head>
<body class="min-h-screen p-3 md:p-6">
<div class="max-w-4xl mx-auto notebook">
  <div class="tape strawberry">杨梅专属手账 ♡</div>
  <h1 class="text-4xl md:text-5xl text-center heart-title mt-3 mb-2">杨梅的家庭手账菜单</h1>
  <p class="text-center text-sm mb-4" style="color:#b07890">记录我们爱吃的菜，今天也要一起好好吃饭呀 💕</p>
  
  <!-- 调整了Tab顺序 -->
  <div class="flex flex-wrap gap-2 justify-center mb-5">
    <button class="tab-btn active" id="tab-order" onclick="switchTab('order')">🛒 点餐台</button>
    <button class="tab-btn" id="tab-random" onclick="switchTab('random')">🎲 随机点单</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">📜 点单列表</button>
    <button class="tab-btn" id="tab-library" onclick="switchTab('library')">📖 菜谱库</button>
  </div>

  <!-- 点餐台（添加了图片展示） -->
  <div id="page-order" class="page">
    <div class="tape-card mb-4">
      <div class="tape peach">🛒 杨梅点餐台</div>
      <div class="tip-bubble mt-3 mb-3 text-sm">🍰 想吃哪个就点哪个，加上备注，生成订单发给大厨吧！</div>
      <div id="orderList" class="grid gap-3 max-h-[420px] overflow-y-auto pr-1"></div>
      <div class="mt-4">
        <label class="text-sm">给大厨的备注：</label>
        <input id="orderNote" placeholder="比如：少放辣，多放糖~">
      </div>
      <div class="mt-4 flex flex-wrap gap-2">
        <button class="btn-cute" onclick="generateOrder()">📝 生成点餐单</button>
        <button class="btn-pink" onclick="clearOrder()">🗑 清空重选</button>
      </div>
    </div>
    <div class="hand-border">
      <h3 class="text-xl heart-title mb-2">📋 点餐单预览</h3>
      <div id="orderPreview"><p style="color:#b07890">还没有点菜，去上面选几道吧～</p></div>
      <button id="copyOrderBtn" class="btn-soft mt-3 hidden" onclick="copyOrderText()">📋 复制点餐单</button>
    </div>
  </div>

  <!-- 随机点菜 -->
  <div id="page-random" class="page hidden">
    <div class="tape-card">
      <div class="tape strawberry">今天吃什么？交给幸运签</div>
      <div class="mt-3 text-sm" style="color:#b07890">杨梅选一个数量，我来帮你随机抽菜啦 ✨</div>
      <div class="mt-3 flex flex-wrap items-center gap-2">
        <label>抽取数量：</label>
        <input id="randNum" type="number" value="3" min="1" max="12" style="width:90px">
        <button class="btn-cute" onclick="pickRandom()">🎲 开始随机点单</button>
      </div>
      <div id="randResult" class="mt-4"></div>
    </div>
  </div>

  <!-- 点单历史（新增） -->
  <div id="page-history" class="page hidden">
    <div class="tape-card mb-4">
      <div class="tape lemon">📜 历史点单记录</div>
      <div class="tip-bubble mt-3 mb-3 text-sm">这里记录了杨梅点过的所有菜单，时间倒序排列哦～</div>
      <div id="historyList" class="grid gap-3 max-h-[500px] overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- 菜谱库 -->
  <div id="page-library" class="page hidden">
    <div class="tape-card mb-5">
      <div class="tape lemon">添加一道杨梅爱吃的菜</div>
      <input type="hidden" id="editId">
      <div class="grid md:grid-cols-2 gap-3 mt-2">
        <div><label class="text-sm">菜名 ♡</label><input id="rname" placeholder="比如：番茄炒蛋"></div>
        <div>
          <label class="text-sm">分类</label>
          <select id="rcate">
            <option value="荤菜">荤菜</option>
            <option value="素菜">素菜</option>
            <option value="汤品">汤品</option>
            <option value="主食">主食</option>
          </select>
        </div>
        <div>
          <label class="text-sm">难度</label>
          <select id="rdiff">
            <option value="简单">简单</option>
            <option value="中等">中等</option>
            <option value="困难">困难</option>
          </select>
        </div>
        <div>
          <label class="text-sm">上传图片</label>
          <input type="file" id="rimg-file" accept="image/*" onchange="uploadImage()" style="border-style:solid; padding:8px;">
          <input type="hidden" id="rimg">
          <p id="upload-status" class="text-xs text-blue-500 mt-1"></p>
          <img id="rimg-preview" class="mt-2 rounded hidden" style="max-height:100px; border:2px solid #FFD1E0;">
          <p class="text-xs mt-1" style="color:#b07890;">或者手动粘贴图片链接：</p>
          <input id="rimg-url" placeholder="https://..." oninput="document.getElementById('rimg').value = this.value">
        </div>
      </div>
      <div class="mt-3"><label class="text-sm">食材（逗号分隔）</label><textarea id="ringre" rows="2" placeholder="鸡蛋, 番茄, 盐, 糖"></textarea></div>
      <div class="mt-3"><label class="text-sm">做法</label><textarea id="rstep" rows="3" placeholder="简单写一下步骤就好啦"></textarea></div>
      <div class="mt-4 flex flex-wrap gap-2">
        <button class="btn-cute" onclick="saveRecipe()">💾 保存菜谱</button>
        <button class="btn-soft" onclick="clearForm()">🧹 清空表单</button>
      </div>
      <p id="db-status" class="text-xs mt-2 text-red-400"></p>
    </div>
    
    <div class="flex flex-wrap gap-2 mb-4">
      <span class="text-sm" style="color:#b07890">分类筛选：</span>
      <button class="sticker-tag" onclick="filterCate('全部')">全部</button>
      <button class="sticker-tag peach" onclick="filterCate('荤菜')">荤菜</button>
      <button class="sticker-tag lemon" onclick="filterCate('素菜')">素菜</button>
      <button class="sticker-tag berry" onclick="filterCate('汤品')">汤品</button>
      <button class="sticker-tag peach" onclick="filterCate('主食')">主食</button>
    </div>
    <div id="recipeList" class="grid md:grid-cols-2 gap-4"></div>
  </div>
</div>

<script>
// ============ 你的 Supabase 配置 ============
const SUPABASE_URL = "https://walbapquafqibcqdhazq.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_P3OMyZLQbYGHLrbrOVXEdw_cLD4Livn";
let supabaseClient = null;

try {
  if (window.supabase && SUPABASE_ANON_KEY.length > 20) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch(e) {
  console.error("Supabase 初始化失败", e);
  document.getElementById("db-status").innerText = "⚠️ 云端连接失败，已切换为本地模式（数据保存在浏览器中）";
}
// ============================================

let recipes = JSON.parse(localStorage.getItem('yangmei_recipes')) || [];
let cart = JSON.parse(localStorage.getItem('yangmei_cart')) || {}; 
let filterCategory = "全部";
let editDocId = null;

async function uploadImage() {
  const fileInput = document.getElementById("rimg-file");
  const file = fileInput.files[0];
  if (!file) return;

  const preview = document.getElementById("rimg-preview");
  preview.src = URL.createObjectURL(file);
  preview.classList.remove("hidden");

  const status = document.getElementById("upload-status");
  
  if (!supabaseClient) {
    status.innerText = "⚠️ 本地模式无法上传图片，请手动粘贴网络图片链接。";
    status.className = "text-xs text-red-400 mt-1";
    return;
  }

  status.innerText = "⏳ 正在上传图片到云端...";
  status.className = "text-xs text-blue-500 mt-1";

  try {
    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
    const { data, error } = await supabaseClient.storage.from('recipe-images').upload(fileName, file);
    if (error) throw error;

    const { data: urlData } = supabaseClient.storage.from('recipe-images').getPublicUrl(fileName);
    document.getElementById("rimg").value = urlData.publicUrl;
    document.getElementById("rimg-url").value = urlData.publicUrl;
    
    status.innerText = "✅ 图片上传成功！";
    status.className = "text-xs text-green-500 mt-1";
  } catch (err) {
    console.error("上传失败", err);
    status.innerText = "❌ 上传失败：" + err.message + "（请检查Storage桶和权限配置）";
    status.className = "text-xs text-red-400 mt-1";
  }
}

async function loadData() {
  if (supabaseClient) {
    try {
      const {data:recipeData, error:recipeErr} = await supabaseClient.from('recipes').select('*').order('id',{ascending:false});
      if(recipeErr) throw recipeErr;
      if (recipeData && recipeData.length > 0) {
        recipes = recipeData;
        localStorage.setItem('yangmei_recipes', JSON.stringify(recipes));
      }
    } catch(e) {
      console.error("读取云端失败", e);
      document.getElementById("db-status").innerText = "⚠️ 读取云端失败，已切换为本地模式";
    }
  }
  renderAll();
}

async function saveRecipe(){
  const name = document.getElementById("rname").value.trim();
  if(!name){ alert("菜名不能为空哦 😳"); return; }
  
  const payload = {
    name: name,
    cate: document.getElementById("rcate").value,
    diff: document.getElementById("rdiff").value,
    img: document.getElementById("rimg").value,
    ingre: document.getElementById("ringre").value,
    step: document.getElementById("rstep").value
  };

  if (editDocId) {
    const idx = recipes.findIndex(r => r.id === editDocId);
    if(idx > -1) recipes[idx] = {...recipes[idx], ...payload};
  } else {
    payload.id = Date.now(); 
    recipes.unshift(payload);
  }
  localStorage.setItem('yangmei_recipes', JSON.stringify(recipes));
  
  if (supabaseClient) {
    try {
      let res;
      if(editDocId) {
        res = await supabaseClient.from('recipes').update(payload).eq('id',editDocId);
      } else {
        res = await supabaseClient.from('recipes').insert([payload]);
      }
      if(res.error) throw res.error;
      alert("已成功保存到云端啦 💗");
    } catch(e) {
      alert("云端保存失败（已存到本地）：" + e.message);
    }
  } else {
    alert("已保存到本地啦 💗 (若需云端同步请检查Supabase配置)");
  }
  
  editDocId = null;
  clearForm();
  renderAll();
}

function clearForm(){
  editDocId = null;
  document.getElementById("rname").value = "";
  document.getElementById("rcate").value = "荤菜";
  document.getElementById("rdiff").value = "简单";
  document.getElementById("rimg").value = "";
  document.getElementById("rimg-url").value = "";
  document.getElementById("rimg-file").value = "";
  document.getElementById("rimg-preview").classList.add("hidden");
  document.getElementById("upload-status").innerText = "";
  document.getElementById("ringre").value = "";
  document.getElementById("rstep").value = "";
}

function renderRecipeList(){
  const wrap = document.getElementById("recipeList");
  let list = filterCategory==="全部" ? recipes : recipes.filter(r=>r.cate===filterCategory);
  wrap.innerHTML = "";
  if(list.length === 0){
    wrap.innerHTML = '<p class="text-center text-sm" style="color:#b07890">还没有菜谱，快去添加吧～</p>';
    return;
  }
  list.forEach(r=>{
    const div = document.createElement("div");
    div.className = "recipe-card";
    div.innerHTML = `
      <img class="recipe-img" src="${r.img||'https://via.placeholder.com/300x200/FFD1E0/ffffff?text=美食'}" onerror="this.src='https://via.placeholder.com/300x200/FFD1E0/ffffff?text=美食'">
      <div class="text-xl mt-2 heart-title">${r.name}</div>
      <div class="mt-1">
        <span class="sticker-tag peach">${r.cate}</span>
        <span class="sticker-tag lemon">难度 ${r.diff}</span>
      </div>
      <div class="text-sm mt-2">🥕 食材：${r.ingre}</div>
      <div class="text-sm mt-1">📝 做法：${r.step}</div>
      <div class="mt-3 flex gap-2">
        <button class="btn-soft" onclick="editRecipe(${r.id})">✏️ 编辑</button>
        <button class="btn-pink" onclick="delRecipe(${r.id})">🗑 删除</button>
      </div>
    `;
    wrap.appendChild(div);
  });
}

function filterCate(c){ filterCategory = c; renderRecipeList(); }

function switchTab(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
  const targetPage = document.getElementById("page-"+name);
  if(targetPage) targetPage.classList.remove("hidden");
  
  document.querySelectorAll(".tab-btn").forEach(t=>t.classList.remove("active"));
  const targetTab = document.getElementById("tab-"+name);
  if(targetTab) targetTab.classList.add("active");
  
  if(name==="order") renderOrderList();
  if(name==="random") document.getElementById("randResult").innerHTML = '';
  if(name==="history") renderHistoryList();
  if(name==="library") renderRecipeList();
}

// ============ 点餐台功能 (含图片展示) ============
function renderOrderList(){
  const wrap = document.getElementById("orderList");
  wrap.innerHTML = "";
  if(recipes.length === 0){
    wrap.innerHTML = '<p class="text-center text-sm" style="color:#b07890">菜谱库是空的，先添加菜品吧～</p>';
    return;
  }
  recipes.forEach(r=>{
    const qty = cart[r.id] || 0;
    const div = document.createElement("div");
    div.className = "check-item";
    div.style.justifyContent = "space-between";
    div.style.display = "flex";
    div.style.alignItems = "center";
    div.innerHTML = `
      <div style="display:flex; align-items:center; gap:12px; flex:1;">
        <img src="${r.img || 'https://via.placeholder.com/100/FFD1E0/ffffff?text=图'}" style="width:50px; height:50px; object-fit:cover; border-radius:10px; border:2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05);" onerror="this.src='https://via.placeholder.com/100/FFD1E0/ffffff?text=图'">
        <div>
          <div style="font-size:1.1rem; font-weight:bold;">${r.name}</div>
          <div style="font-size:0.8rem; color:#b07890;">${r.cate} · 难度${r.diff}</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        ${qty > 0 ? `<div class="qty-btn" onclick="changeQty(${r.id}, -1)">-</div>` : ''}
        <span style="font-family:'Ma Shan Zheng';font-size:1.2rem;color:#E67A7A;width:20px;text-align:center;">${qty > 0 ? qty : ''}</span>
        <div class="qty-btn" onclick="changeQty(${r.id}, 1)">+</div>
      </div>
    `;
    wrap.appendChild(div);
  });
}

function changeQty(id, delta){
  if(!cart[id]) cart[id] = 0;
  cart[id] += delta;
  if(cart[id] <= 0) delete cart[id];
  localStorage.setItem('yangmei_cart', JSON.stringify(cart));
  renderOrderList();
  renderOrderPreview();
}

function renderOrderPreview(){
  const preview = document.getElementById("orderPreview");
  const copyBtn = document.getElementById("copyOrderBtn");
  const note = document.getElementById("orderNote").value.trim();
  const items = Object.keys(cart).map(id => {
    const r = recipes.find(x => x.id == id);
    return r ? `${r.name} x${cart[id]}` : null;
  }).filter(Boolean);

  if(items.length === 0){
    preview.innerHTML = `<p style="color:#b07890">还没有点菜，去上面选几道吧～</p>`;
    copyBtn.classList.add('hidden');
    return;
  }

  let html = `<div class="text-lg heart-title mb-2">🍽️ 杨梅的点餐单</div>`;
  items.forEach(item => { html += `<div class="mb-1">♡ ${item}</div>`; });
  if(note){ html += `<div class="mt-2 text-sm" style="color:#b07890">📝 备注：${note}</div>`; }
  html += `<div class="text-sm mt-3" style="color:#b07890">大厨，今天就拜托你啦！💕</div>`;
  
  preview.innerHTML = html;
  copyBtn.classList.remove('hidden');
}

// 生成点餐单并保存历史记录
function generateOrder(){
  renderOrderPreview();
  
  const note = document.getElementById("orderNote").value.trim();
  const items = Object.keys(cart).map(id => {
    const r = recipes.find(x => x.id == id);
    // 保存快照，以防菜谱库删除后历史记录无法显示
    return r ? { id: r.id, name: r.name, img: r.img, cate: r.cate, diff: r.diff, qty: cart[id] } : null;
  }).filter(Boolean);

  if(items.length > 0){
    // 1. 保存到本地历史记录
    let history = JSON.parse(localStorage.getItem('yangmei_history')) || [];
    const orderRecord = {
      id: Date.now(),
      date: new Date().toLocaleString(),
      note: note,
      items: items
    };
    history.unshift(orderRecord); // 头部插入，实现时间倒序
    if (history.length > 50) history = history.slice(0, 50); // 最多保留50条
    localStorage.setItem('yangmei_history', JSON.stringify(history));

    // 2. 尝试同步到云端 daily_menu (只存ID数组)
    if (supabaseClient) {
      const todayStr = new Date().toISOString().split('T')[0];
      supabaseClient.from('daily_menu').insert([{
        menu_date: todayStr,
        selected_ids: items.map(i => i.id)
      }]).then(({error}) => {
        if(error) console.error("同步点单记录到云端失败", error);
      });
    }
    
    document.getElementById("orderPreview").scrollIntoView({behavior:"smooth"});
    // 自动刷新一下历史列表，下次切换过去数据是新的
  } else {
    alert("还没有点菜，去上面选几道吧～");
  }
}

function clearOrder(){
  if(!confirm("确定要清空点餐单吗？")) return;
  cart = {};
  document.getElementById("orderNote").value = "";
  localStorage.removeItem('yangmei_cart');
  renderOrderList();
  renderOrderPreview();
}

function copyOrderText(){
  const note = document.getElementById("orderNote").value.trim();
  const items = Object.keys(cart).map(id => {
    const r = recipes.find(x => x.id == id);
    return r ? `${r.name} x${cart[id]}` : null;
  }).filter(Boolean);

  let text = `🍽️ 杨梅的点餐单\n\n`;
  items.forEach((item, i) => { text += `${i+1}. ${item}\n`; });
  if(note) text += `\n📝 备注：${note}\n`;
  text += `\n大厨，今天就拜托你啦！💕`;

  navigator.clipboard.writeText(text).then(() => {
    alert("点餐单已复制！快发给大厨吧 💗");
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy");
    document.body.removeChild(ta);
    alert("点餐单已复制！快发给大厨吧 💗");
  });
}

// ============ 历史记录渲染 (新增) ============
function renderHistoryList(){
  const wrap = document.getElementById("historyList");
  let history = JSON.parse(localStorage.getItem('yangmei_history')) || [];
  
  wrap.innerHTML = "";
  if(history.length === 0){
    wrap.innerHTML = '<p class="text-center text-sm" style="color:#b07890">还没有点过单哦，快去点餐台试试吧～</p>';
    return;
  }

  history.forEach(record => {
    const div = document.createElement("div");
    div.className = "recipe-card";
    
    let itemsHtml = "";
    record.items.forEach(item => {
      itemsHtml += `
        <div style="display:flex; align-items:center; gap:10px; background:#FFFAF2; padding:10px; border-radius:10px; border:1px dashed #FFE0EC; margin-bottom:8px;">
          <img src="${item.img || 'https://via.placeholder.com/100/FFD1E0/ffffff?text=图'}" style="width:40px; height:40px; object-fit:cover; border-radius:8px;" onerror="this.src='https://via.placeholder.com/100/FFD1E0/ffffff?text=图'">
          <div style="flex:1; font-size:0.95rem;">
            ${item.name} <span class="sticker-tag peach" style="font-size:11px; padding:1px 8px;">x${item.qty}</span>
          </div>
          <div style="font-size:0.75rem; color:#b07890;">${item.cate}</div>
        </div>
      `;
    });

    div.innerHTML = `
      <div class="text-lg heart-title mb-2 flex justify-between items-center">
        <span>📅 ${record.date}</span>
      </div>
      <div class="grid md:grid-cols-2 gap-2">${itemsHtml}</div>
      ${record.note ? `<div class="text-sm mt-2" style="color:#b07890; background:#FFF4B8; padding:8px; border-radius:8px;">📝 备注：${record.note}</div>` : ''}
    `;
    wrap.appendChild(div);
  });
}

// ============ 随机点菜 ============
function pickRandom(){
  const num = Number(document.getElementById("randNum").value);
  const wrap = document.getElementById("randResult");
  if(recipes.length ===0){
    wrap.innerHTML = `<p>菜谱库是空的，先给杨梅加几道菜吧～</p>`;
    return;
  }
  const copy = [...recipes].sort(()=>Math.random()-0.5).slice(0,num);
  let html = `<div class="hand-border">`;
  html += `<div class="text-lg heart-title mb-2">🎲 今日幸运菜单</div>`;
  copy.forEach((r,i)=>{
    html += `<div class="mb-1">${i+1}. ${r.name} <span class="sticker-tag peach" style="font-size:12px">${r.cate}</span></div>`;
  });
  html += `<div class="text-sm mt-2" style="color:#b07890">是不是杨梅爱吃的那几道呢？💕</div>`;
  html += `</div>`;
  wrap.innerHTML = html;
}

function renderAll(){ renderRecipeList(); }

function editRecipe(id){
  editDocId = id;
  const r = recipes.find(x=>x.id === id);
  document.getElementById("rname").value = r.name;
  document.getElementById("rcate").value = r.cate;
  document.getElementById("rdiff").value = r.diff;
  document.getElementById("rimg").value = r.img || "";
  document.getElementById("rimg-url").value = r.img || "";
  if(r.img) {
    const preview = document.getElementById("rimg-preview");
    preview.src = r.img;
    preview.classList.remove("hidden");
  }
  document.getElementById("ringre").value = r.ingre;
  document.getElementById("rstep").value = r.step;
  
  // 自动切换到菜谱库Tab
  switchTab('library');
}

async function delRecipe(id){
  if(!confirm("确定要把这道菜从杨梅的菜单里删掉吗？")) return;
  if (supabaseClient) {
    const {error} = await supabaseClient.from('recipes').delete().eq('id',id);
    if(error){ alert("云端删除失败："+error.message); return; }
  }
  recipes = recipes.filter(r => r.id !== id);
  localStorage.setItem('yangmei_recipes', JSON.stringify(recipes));
  renderAll();
}

window.switchTab = switchTab;
window.saveRecipe = saveRecipe;
window.clearForm = clearForm;
window.filterCate = filterCate;
window.editRecipe = editRecipe;
window.delRecipe = delRecipe;
window.changeQty = changeQty;
window.generateOrder = generateOrder;
window.clearOrder = clearOrder;
window.copyOrderText = copyOrderText;
window.pickRandom = pickRandom;
window.uploadImage = uploadImage;

window.onload = loadData;
</script>
