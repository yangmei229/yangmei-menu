<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杨梅的家庭手账菜单 💕</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        hand: ['"Ma Shan Zheng"', 'cursive'],
        zcool: ['"ZCOOL KuaiLe"', 'sans-serif']
      },
      colors: {
        cream: '#FFF7F1',
        berry: '#E67A7A',
        peach: '#FFD9C0',
        lemon: '#FFF4B8',
        pinkpaper: '#FFEEF2',
        ink: '#5B4652'
      }
    }
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  body {
    background: #FFEEF2;
    background-image:
      radial-gradient(circle at 10% 20%, #FFD1E0 0 8%, transparent 9%),
      radial-gradient(circle at 80% 10%, #FFF4B8 0 10%, transparent 11%),
      radial-gradient(circle at 70% 80%, #FFD9C0 0 9%, transparent 10%),
      repeating-linear-gradient(#FFE0EC 0 1px, transparent 1px 34px);
    color: #5B4652;
    font-family: 'ZCOOL KuaiLe', sans-serif;
  }
  .notebook {
    background: rgba(255, 247, 241, 0.92);
    border: 3px dashed #E6A5B8;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(230, 122, 122, 0.15);
    position: relative;
    padding: 24px 18px;
  }
  .notebook::before {
    content: "💕";
    position: absolute;
    top: -14px;
    left: 18px;
    background: #FFD1E0;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 14px;
    border: 2px solid #fff;
  }
  .tape-card {
    position: relative;
    background: #fffbf6;
    border: 2px solid #F2C4CE;
    border-radius: 14px;
    box-shadow: 0 6px 14px rgba(230, 122, 122, 0.12);
    padding: 18px;
  }
  .tape {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%) rotate(-3deg);
    background: #FFD1E0;
    color: #fff;
    padding: 4px 14px;
    border-radius: 10px;
    font-size: 13px;
    letter-spacing: 1px;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(230, 122, 122, 0.25);
  }
  .tape.strawberry { background: #E67A7A; }
  .tape.lemon { background: #F2D166; }
  .tape.peach { background: #FFBFA3; }
  .sticker-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 10px;
    font-family: 'Ma Shan Zheng', cursive;
    background: #FFD1E0;
    color: #fff;
    transform: rotate(-2deg);
    box-shadow: 0 2px 4px rgba(230, 122, 122, 0.25);
    margin-right: 6px;
    margin-bottom: 4px;
  }
  .sticker-tag.peach { background: #FFBFA3; }
  .sticker-tag.lemon { background: #F2D166; color: #7a5b30; }
  .sticker-tag.berry { background: #E67A7A; }
  .heart-title {
    font-family: 'Ma Shan Zheng', cursive;
    background: linear-gradient(90deg, #E67A7A, #FFBFA3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .btn-cute {
    background: linear-gradient(180deg, #FFD1E0, #FFB6C8);
    color: #fff;
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 10px 18px;
    box-shadow: 0 4px 10px rgba(230, 122, 122, 0.3);
    transition: transform .15s ease;
  }
  .btn-cute:hover { transform: translateY(-2px) scale(1.03); }
  .btn-soft {
    background: #FFF4B8;
    color: #7a5b30;
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 8px 14px;
    box-shadow: 0 3px 8px rgba(242, 209, 102, 0.35);
  }
  .btn-pink {
    background: #FFB6C8;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 8px 14px;
  }
  input, textarea, select {
    background: #fff;
    border: 2px dashed #F2C4CE;
    border-radius: 12px;
    padding: 10px 12px;
    font-family: 'ZCOOL KuaiLe', sans-serif;
    color: #5B4652;
    width: 100%;
  }
  .recipe-card {
    background: #fff;
    border: 2px solid #FFD1E0;
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 6px 14px rgba(230, 122, 122, 0.12);
    position: relative;
    overflow: hidden;
  }
  .recipe-card::before {
    content: "♡";
    position: absolute;
    top: 10px;
    right: 12px;
    color: #FFB6C8;
    font-size: 22px;
  }
  .recipe-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 12px;
    border: 3px solid #fff;
    box-shadow: 0 4px 10px rgba(230, 122, 122, 0.18);
  }
  .check-item {
    background: #fff;
    border: 2px dashed #FFD1E0;
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tab-btn {
    background: #fff;
    border: 2px solid #F2C4CE;
    border-radius: 999px;
    padding: 8px 14px;
    color: #5B4652;
  }
  .tab-btn.active {
    background: #FFD1E0;
    color: #fff;
    border-color: #FFB6C8;
  }
  .hand-border {
    border: 2px dashed #E6A5B8;
    border-radius: 16px;
    background: #FFFAF2;
    padding: 16px;
  }
  .tip-bubble {
    background: #FFF4B8;
    border-radius: 14px;
    padding: 10px 14px;
    color: #7a5b30;
    position: relative;
  }
  .heart-divider {
    text-align: center;
    color: #FFB6C8;
    font-size: 20px;
    margin: 14px 0;
    letter-spacing: 4px;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #FFB6C8; border-radius: 4px; }
</style>
</head>
<body class="min-h-screen p-3 md:p-6">
<div class="max-w-4xl mx-auto notebook">
  <div class="tape strawberry">杨梅专属手账 ♡</div>
  <h1 class="text-4xl md:text-5xl text-center heart-title mt-3 mb-2">
    杨梅的家庭手账菜单
  </h1>
  <p class="text-center text-sm mb-4" style="color:#b07890">
    记录我们爱吃的菜，今天也要一起好好吃饭呀 💕
  </p>
  <div class="flex flex-wrap gap-2 justify-center mb-5">
    <button class="tab-btn active" id="tab-library" onclick="switchTab('library')">📖 菜谱库</button>
    <button class="tab-btn" id="tab-today" onclick="switchTab('today')">🍽️ 今日菜单</button>
    <button class="tab-btn" id="tab-random" onclick="switchTab('random')">🎲 随机点单</button>
    <button class="tab-btn" id="tab-share" onclick="switchTab('share')">💌 发给杨梅</button>
  </div>
  <!-- 菜谱库 -->
  <div id="page-library" class="page">
    <div class="tape-card mb-5">
      <div class="tape lemon">添加一道杨梅爱吃的菜</div>
      <input type="hidden" id="editId">
      <div class="grid md:grid-cols-2 gap-3 mt-2">
        <div>
          <label class="text-sm">菜名 ♡</label>
          <input id="rname" placeholder="比如：番茄炒蛋">
        </div>
        <div>
          <label class="text-sm">分类</label>
          <select id="rcate">
            <option value="荤菜">荤菜</option>
            <option value="素菜">素菜</option>
            <option value="汤品">汤品</option>
            <option value="主食">主食</option>
          </select>
        </div>
        <div>
          <label class="text-sm">难度</label>
          <select id="rdiff">
            <option value="简单">简单</option>
            <option value="中等">中等</option>
            <option value="困难">困难</option>
          </select>
        </div>
        <div>
          <label class="text-sm">图片链接</label>
          <input id="rimg" placeholder="https://...">
        </div>
      </div>
      <div class="mt-3">
        <label class="text-sm">食材（逗号分隔）</label>
        <textarea id="ringre" rows="2" placeholder="鸡蛋, 番茄, 盐, 糖"></textarea>
      </div>
      <div class="mt-3">
        <label class="text-sm">做法</label>
        <textarea id="rstep" rows="3" placeholder="简单写一下步骤就好啦"></textarea>
      </div>
      <div class="mt-4 flex flex-wrap gap-2">
        <button class="btn-cute" onclick="saveRecipe()">💾 保存菜谱</button>
        <button class="btn-soft" onclick="clearForm()">🧹 清空表单</button>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 mb-4">
      <span class="text-sm" style="color:#b07890">分类筛选：</span>
      <button class="sticker-tag" onclick="filterCate('全部')">全部</button>
      <button class="sticker-tag peach" onclick="filterCate('荤菜')">荤菜</button>
      <button class="sticker-tag lemon" onclick="filterCate('素菜')">素菜</button>
      <button class="sticker-tag berry" onclick="filterCate('汤品')">汤品</button>
      <button class="sticker-tag peach" onclick="filterCate('主食')">主食</button>
    </div>
    <div id="recipeList" class="grid md:grid-cols-2 gap-4"></div>
  </div>
  <!-- 今日菜单 -->
  <div id="page-today" class="page hidden">
    <div class="tape-card mb-4">
      <div class="tape peach">勾选今天想吃的菜</div>
      <div class="tip-bubble mt-3 mb-3 text-sm">
        🍰 小提示：杨梅喜欢的菜可以多选一点，搭配成完整的一餐哦！
      </div>
      <div id="checkList" class="grid md:grid-cols-2 gap-3 max-h-[420px] overflow-y-auto pr-1"></div>
      <div class="mt-4 flex flex-wrap gap-2">
        <button class="btn-cute" onclick="saveTodayMenu()">💖 保存今日菜单</button>
        <button class="btn-pink" onclick="clearToday()">🗑 重新选择</button>
      </div>
    </div>
    <div class="hand-border">
      <h3 class="text-xl heart-title mb-2">今日菜单记录</h3>
      <div id="todayShow"></div>
    </div>
  </div>
  <!-- 随机点菜 -->
  <div id="page-random" class="page hidden">
    <div class="tape-card">
      <div class="tape strawberry">今天吃什么？交给幸运签</div>
      <div class="mt-3 text-sm" style="color:#b07890">
        杨梅选一个数量，我来帮你随机抽菜啦 ✨
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-2">
        <label>抽取数量：</label>
        <input id="randNum" type="number" value="3" min="1" max="12" style="width:90px">
        <button class="btn-cute" onclick="pickRandom()">🎲 开始随机点单</button>
      </div>
      <div id="randResult" class="mt-4"></div>
    </div>
  </div>
  <!-- 分享菜单 -->
  <div id="page-share" class="page hidden">
    <div class="tape-card">
      <div class="tape lemon">把菜单分享给杨梅</div>
      <div class="tip-bubble mt-3 text-sm">
        💌 复制链接发给她，打开就能直接看到你搭配好的整套菜单！
      </div>
      <textarea id="shareLink" class="w-full mt-3" rows="4" readonly placeholder="分享链接会在这里生成..."></textarea>
      <div class="mt-3 flex flex-wrap gap-2">
        <button class="btn-cute" onclick="copyShare()">📋 复制链接</button>
        <button class="btn-soft" onclick="buildShareLink()">🔄 重新生成链接</button>
      </div>
      <div id="sharePreview" class="mt-4 hand-border"></div>
    </div>
  </div>
</div>

<script>
// ============你的Supabase配置，无需修改============
const SUPABASE_URL = "https://walbapquafqibcqdhazq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_P3OMyZLQbYGHLrbrOVXEdw_cLD4Livn";
const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// =================================================

let recipes = [];
let selectedIds = [];
let filterCategory = "全部";
let editDocId = null;

// 页面加载：读取云端数据
async function loadData() {
  // 读取菜谱
  const {data:recipeData, error:recipeErr} = await supabase.from('recipes').select('*').order('id',{ascending:false});
  if(recipeErr){
    alert("读取云端菜谱失败，请检查网络与数据库配置");
    console.error(recipeErr);
  }else{
    recipes = recipeData;
  }

  //解析分享链接参数
  const url = new URL(location.href);
  const shareRaw = url.searchParams.get("menu");
  if(shareRaw){
    try{
      selectedIds = JSON.parse(decodeURIComponent(shareRaw));
      setTimeout(()=>alert("💌 收到一份来自杨梅的菜单邀请，已打开！"),100);
    }catch(e){}
  }
  renderAll();
}

//保存菜谱（新增/更新）
async function saveRecipe(){
  const name = document.getElementById("rname").value.trim();
  if(!name){
    alert("菜名不能为空哦，杨梅会问我吃什么哒 😳");
    return;
  }
  const payload = {
    name: name,
    cate: document.getElementById("rcate").value,
    diff: document.getElementById("rdiff").value,
    img: document.getElementById("rimg").value,
    ingre: document.getElementById("ringre").value,
    step: document.getElementById("rstep").value
  };
  let res;
  if(editDocId){
    res = await supabase.from('recipes').update(payload).eq('id',editDocId);
  }else{
    res = await supabase.from('recipes').insert([payload]);
  }
  if(res.error){
    alert("保存失败："+res.error.message);
    return;
  }
  editDocId = null;
  clearForm();
  await loadData();
  alert("已保存到杨梅的手账菜单啦 💗");
}

//编辑回填
function editRecipe(id){
  editDocId = id;
  const r = recipes.find(x=>x.id === id);
  document.getElementById("rname").value = r.name;
  document.getElementById("rcate").value = r.cate;
  document.getElementById("rdiff").value = r.diff;
  document.getElementById("rimg").value = r.img;
  document.getElementById("ringre").value = r.ingre;
  document.getElementById("rstep").value = r.step;
}

//删除菜谱
async function delRecipe(id){
  if(!confirm("确定要把这道菜从杨梅的菜单里删掉吗？")) return;
  const {error} = await supabase.from('recipes').delete().eq('id',id);
  if(error){
    alert("删除失败："+error.message);
    return;
  }
  await loadData();
}

function clearForm(){
  editDocId = null;
  document.getElementById("rname").value = "";
  document.getElementById("rcate").value = "荤菜";
  document.getElementById("rdiff").value = "简单";
  document.getElementById("rimg").value = "";
  document.getElementById("ringre").value = "";
  document.getElementById("rstep").value = "";
}

function renderRecipeList(){
  const wrap = document.getElementById("recipeList");
  let list = filterCategory==="全部" ? recipes : recipes.filter(r=>r.cate===filterCategory);
  wrap.innerHTML = "";
  list.forEach(r=>{
    const div = document.createElement("div");
    div.className = "recipe-card";
    div.innerHTML = `
      <img class="recipe-img" src="${r.img||''}" onerror="this.style.display='none'">
      <div class="text-xl mt-2 heart-title">${r.name}</div>
      <div class="mt-1">
        <span class="sticker-tag peach">${r.cate}</span>
        <span class="sticker-tag lemon">难度 ${r.diff}</span>
      </div>
      <div class="text-sm mt-2">🥕 食材：${r.ingre}</div>
      <div class="text-sm mt-1">📝 做法：${r.step}</div>
      <div class="mt-3 flex gap-2">
        <button class="btn-soft" onclick="editRecipe(${r.id})">✏️ 编辑</button>
        <button class="btn-pink" onclick="delRecipe(${r.id})">🗑 删除</button>
      </div>
    `;
    wrap.appendChild(div);
  });
}

function filterCate(c){
  filterCategory = c;
  renderRecipeList();
}

//切换标签
function switchTab(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
  document.getElementById("page-"+name).classList.remove("hidden");
  document.querySelectorAll(".tab-btn").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active");
  if(name==="today") renderCheckList();
  if(name==="share") buildShareLink();
}

//今日菜单勾选渲染
function renderCheckList(){
  const wrap = document.getElementById("checkList");
  wrap.innerHTML = "";
  recipes.forEach(r=>{
    const label = document.createElement("label");
    label.className = "check-item";
    const checked = selectedIds.includes(r.id) ? "checked" : "";
    label.innerHTML = `
      <input type="checkbox" ${checked} onchange="toggleSelect(${r.id})">
      <span>${r.name}</span>
      <span class="sticker-tag peach" style="font-size:12px">${r.cate}</span>
    `;
    wrap.appendChild(label);
  });
  renderTodayShow();
}

function toggleSelect(id){
  const idx = selectedIds.indexOf(id);
  if(idx >=0 ) selectedIds.splice(idx,1);
  else selectedIds.push(id);
  renderTodayShow();
}

//保存今日菜单到云端 upsert更新今日记录
async function saveTodayMenu(){
  const todayStr = new Date().toISOString().split('T')[0];
  const {error} = await supabase.from('daily_menu')
    .upsert({menu_date:todayStr, selected_ids:selectedIds},{onConflict:"menu_date"});
  if(error){
    alert("保存今日菜单失败："+error.message);
    return;
  }
  alert("今日菜单已记录，杨梅看到会开心的 💗");
}

function clearToday(){
  selectedIds = [];
  renderCheckList();
}

function renderTodayShow(){
  const wrap = document.getElementById("todayShow");
  const sel = recipes.filter(r=>selectedIds.includes(r.id));
  if(!sel.length){
    wrap.innerHTML = `<p style="color:#b07890">还没有勾选菜品，快去选几道杨梅爱吃的吧～</p>`;
    return;
  }
  let html = `<div class="heart-divider">♡ ♡ ♡</div>`;
  sel.forEach(r=>{
    html += `
      <div class="recipe-card mb-3">
        <div class="text-lg heart-title">${r.name}</div>
        <div>
          <span class="sticker-tag peach">${r.cate}</span>
          <span class="sticker-tag lemon">难度 ${r.diff}</span>
        </div>
        <div class="text-sm mt-1">🥕 ${r.ingre}</div>
      </div>
    `;
  });
  html += `<div class="heart-divider">♡ 今日也要好好吃饭 ♡</div>`;
  wrap.innerHTML = html;
}

//随机点菜
function pickRandom(){
  const num = Number(document.getElementById("randNum").value);
  const wrap = document.getElementById("randResult");
  if(recipes.length ===0){
    wrap.innerHTML = `<p>菜谱库是空的，先给杨梅加几道菜吧～</p>`;
    return;
  }
  const copy = [...recipes].sort(()=>Math.random()-0.5).slice(0,num);
  let html = `<div class="hand-border">`;
  html += `<div class="text-lg heart-title mb-2">🎲 今日幸运菜单</div>`;
  copy.forEach((r,i)=>{
    html += `<div class="mb-1">${i+1}. ${r.name} <span class="sticker-tag peach" style="font-size:12px">${r.cate}</span></div>`;
  });
  html += `<div class="text-sm mt-2" style="color:#b07890">是不是杨梅爱吃的那几道呢？💕</div>`;
  html += `</div>`;
  wrap.innerHTML = html;
}

//分享链接
function buildShareLink(){
  const data = encodeURIComponent(JSON.stringify(selectedIds));
  const link = location.origin + location.pathname + "?menu=" + data;
  document.getElementById("shareLink").value = link;
  const preview = document.getElementById("sharePreview");
  const sel = recipes.filter(r=>selectedIds.includes(r.id));
  if(!sel.length){
    preview.innerHTML = `<p style="color:#b07890">还没有勾选菜品，先去【今日菜单】选几道吧～</p>`;
    return;
  }
  let html = `<div class="text-lg heart-title mb-2">💌 给杨梅的菜单预览</div>`;
  sel.forEach(r=>{
    html += `<div class="mb-1">♡ ${r.name} · ${r.cate} · 难度${r.diff}</div>`;
  });
  html += `<div class="text-sm mt-2" style="color:#b07890">打开链接就能直接看到这套菜单啦～</div>`;
  preview.innerHTML = html;
}

async function copyShare(){
  const el = document.getElementById("shareLink");
  if(!el.value){
    alert("还没有分享链接，先去勾选菜品生成吧～");
    return;
  }
  el.select();
  el.setSelectionRange(0, 9999);
  if(navigator.clipboard){
    await navigator.clipboard.writeText(el.value);
    alert("链接已复制，发给杨梅吧 💗");
  }else{
    document.execCommand("copy");
    alert("链接已复制，发给杨梅吧 💗");
  }
}

function renderAll(){
  renderRecipeList();
  renderCheckList();
}

window.onload = loadData;
</script>
</body>
</html>
