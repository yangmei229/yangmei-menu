<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杨梅的专属菜单 💕</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { hand: ['"Ma Shan Zheng"', 'cursive'], zcool: ['"ZCOOL KuaiLe"', 'sans-serif'] },
      colors: { cream: '#FFF7F1', berry: '#E67A7A', peach: '#FFD9C0', lemon: '#FFF4B8', pinkpaper: '#FFEEF2', ink: '#5B4652' }
    }
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  body {
    background: #FFEEF2;
    background-image: radial-gradient(circle at 10% 20%, #FFD1E0 0 8%, transparent 9%), radial-gradient(circle at 80% 10%, #FFF4B8 0 10%, transparent 11%), radial-gradient(circle at 70% 80%, #FFD9C0 0 9%, transparent 10%), repeating-linear-gradient(#FFE0EC 0 1px, transparent 1px 34px);
    color: #5B4652; font-family: 'ZCOOL KuaiLe', sans-serif;
  }
  .notebook { background: rgba(255, 247, 241, 0.92); border: 3px dashed #E6A5B8; border-radius: 18px; box-shadow: 0 10px 30px rgba(230, 122, 122, 0.15); position: relative; padding: 24px 18px; }
  .notebook::before { content: "💕"; position: absolute; top: -14px; left: 18px; background: #FFD1E0; padding: 4px 10px; border-radius: 12px; font-size: 14px; border: 2px solid #fff; }
  .tape-card { position: relative; background: #fffbf6; border: 2px solid #F2C4CE; border-radius: 14px; box-shadow: 0 6px 14px rgba(230, 122, 122, 0.12); padding: 18px; }
  .tape { position: absolute; top: -14px; left: 50%; transform: translateX(-50%) rotate(-3deg); background: #FFD1E0; color: #fff; padding: 4px 14px; border-radius: 10px; font-size: 13px; letter-spacing: 1px; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(230, 122, 122, 0.25); }
  .tape.strawberry { background: #E67A7A; } .tape.lemon { background: #F2D166; } .tape.peach { background: #FFBFA3; }
  .sticker-tag { display: inline-block; padding: 3px 10px; border-radius: 10px; font-family: 'Ma Shan Zheng', cursive; background: #FFD1E0; color: #fff; transform: rotate(-2deg); box-shadow: 0 2px 4px rgba(230, 122, 122, 0.25); margin-right: 6px; margin-bottom: 4px; font-size: 13px; }
  .sticker-tag.peach { background: #FFBFA3; } .sticker-tag.lemon { background: #F2D166; color: #7a5b30; } .sticker-tag.berry { background: #E67A7A; } .sticker-tag.sweet { background: #A8E6CF; color: #3B7A57; } .sticker-tag.drink { background: #D4C4FB; color: #5B3E96; }
  .heart-title { font-family: 'Ma Shan Zheng', cursive; background: linear-gradient(90deg, #E67A7A, #FFBFA3); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .btn-cute { background: linear-gradient(180deg, #FFD1E0, #FFB6C8); color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 10px 18px; box-shadow: 0 4px 10px rgba(230, 122, 122, 0.3); transition: all .2s ease; }
  .btn-cute:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); }
  .btn-cute:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-soft { background: #FFF4B8; color: #7a5b30; border: 2px solid #fff; border-radius: 999px; padding: 8px 14px; box-shadow: 0 3px 8px rgba(242, 209, 102, 0.35); transition: transform .15s; }
  .btn-soft:active { transform: scale(0.95); }
  .btn-pink { background: #FFB6C8; color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 8px 14px; transition: transform .15s; }
  .btn-pink:active { transform: scale(0.95); }
  input, select { background: #fff; border: 2px dashed #F2C4CE; border-radius: 12px; padding: 10px 12px; font-family: 'ZCOOL KuaiLe', sans-serif; color: #5B4652; width: 100%; }
  .recipe-card { background: #fff; border: 2px solid #FFD1E0; border-radius: 16px; padding: 14px; box-shadow: 0 6px 14px rgba(230, 122, 122, 0.12); position: relative; overflow: hidden; transition: transform 0.2s; }
  .recipe-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(230, 122, 122, 0.2); }
  .recipe-img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(230, 122, 122, 0.18); }
  .tab-btn { background: #fff; border: 2px solid #F2C4CE; border-radius: 999px; padding: 8px 16px; color: #5B4652; font-size: 0.95rem; transition: all 0.2s; white-space: nowrap; }
  .tab-btn.active { background: #FFD1E0; color: #fff; border-color: #FFB6C8; box-shadow: 0 4px 10px rgba(230, 122, 122, 0.2); }
  .tab-btn:hover:not(.active) { background: #FFF7F1; }
  .hand-border { border: 2px dashed #E6A5B8; border-radius: 16px; background: #FFFAF2; padding: 16px; }
  .qty-btn { width: 32px; height: 32px; border-radius: 50%; background: #FFD1E0; color: #E67A7A; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(230, 122, 122, 0.2); cursor: pointer; user-select: none; transition: transform 0.1s; }
  .qty-btn:active { transform: scale(0.85); }
  .filter-btn { background: #fff; border: 2px solid #FFE0EC; border-radius: 999px; padding: 5px 14px; font-size: 0.85rem; color: #b07890; cursor: pointer; transition: all 0.2s; }
  .filter-btn.active { background: #FFE0EC; color: #E67A7A; border-color: #FFB6C8; font-weight: bold; }
  
  .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
  .upload-btn-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }
  .upload-btn { border: 2px dashed #F2C4CE; color: #E67A7A; background-color: #FFF7F1; padding: 12px; border-radius: 12px; font-size: 0.95rem; text-align: center; width: 100%; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; font-family: 'ZCOOL KuaiLe', sans-serif; cursor: pointer; }
  .upload-btn:hover { background-color: #FFE0EC; border-color: #FFB6C8; }

  /* 昵称设置弹框 */
  #name-modal {
    visibility: hidden; opacity: 0;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 238, 242, 0.7);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 10001;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #name-modal.show { visibility: visible; opacity: 1; }
  #name-content {
    background: linear-gradient(135deg, #ffffff, #FFF7F1);
    border: 4px dashed #FFB6C8;
    padding: 40px; border-radius: 32px;
    box-shadow: 0 25px 60px rgba(230, 122, 122, 0.4), inset 0 0 30px rgba(255, 214, 224, 0.3);
    text-align: center;
    max-width: 90%; position: relative;
  }
  #name-content::before {
    content: "👋"; position: absolute; top: -22px; left: 50%;
    transform: translateX(-50%); background: #FFD1E0;
    padding: 6px 16px; border-radius: 24px; font-size: 24px;
    border: 3px solid #fff; box-shadow: 0 4px 10px rgba(230, 122, 122, 0.2);
  }

  /* 全屏居中 Modal Toast (自己操作时) */
  #toast-modal {
    visibility: hidden; opacity: 0;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 238, 242, 0.45);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  #toast-modal.show { visibility: visible; opacity: 1; }
  #toast-content {
    background: linear-gradient(135deg, #ffffff, #FFF7F1);
    border: 3px dashed #FFB6C8;
    padding: 30px 40px; border-radius: 28px;
    box-shadow: 0 20px 50px rgba(230, 122, 122, 0.3), inset 0 0 20px rgba(255, 214, 224, 0.3);
    text-align: center;
    transform: scale(0.7) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-width: 85%; position: relative;
  }
  #toast-modal.show #toast-content { transform: scale(1) translateY(0); }
  #toast-content::before {
    content: "💖"; position: absolute; top: -18px; left: 50%;
    transform: translateX(-50%); background: #FFD1E0;
    padding: 4px 12px; border-radius: 20px; font-size: 20px;
    border: 2px solid #fff; box-shadow: 0 4px 10px rgba(230, 122, 122, 0.2);
  }
  #toast-message {
    font-family: 'Ma Shan Zheng', cursive; font-size: 1.6rem;
    color: #E67A7A; line-height: 1.6; letter-spacing: 1px;
  }
  #toast-icon { font-size: 3rem; margin-bottom: 15px; display: block; animation: heartBeat 1.5s infinite; }
  @keyframes heartBeat { 0% { transform: scale(1); } 14% { transform: scale(1.1); } 28% { transform: scale(1); } 42% { transform: scale(1.1); } 70% { transform: scale(1); } }

  /* 对方点单提醒弹框 (手动关闭) */
  #notify-modal {
    visibility: hidden; opacity: 0;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 238, 242, 0.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 10000;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  #notify-modal.show { visibility: visible; opacity: 1; }
  #notify-content {
    background: linear-gradient(135deg, #ffffff, #FFF7F1);
    border: 4px dashed #FFB6C8;
    padding: 30px 40px; border-radius: 32px;
    box-shadow: 0 25px 60px rgba(230, 122, 122, 0.4), inset 0 0 30px rgba(255, 214, 224, 0.3);
    text-align: center;
    transform: scale(0.7) translateY(30px);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-width: 90%; position: relative;
  }
  #notify-modal.show #notify-content { transform: scale(1) translateY(0); }
  #notify-content::before {
    content: "💌"; position: absolute; top: -22px; left: 50%;
    transform: translateX(-50%); background: #FFD1E0;
    padding: 6px 16px; border-radius: 24px; font-size: 24px;
    border: 3px solid #fff; box-shadow: 0 4px 10px rgba(230, 122, 122, 0.2);
  }
  #notify-message {
    font-family: 'Ma Shan Zheng', cursive; font-size: 1.8rem;
    color: #E67A7A; line-height: 1.5; letter-spacing: 2px;
    margin-bottom: 20px;
  }
  #notify-sub {
    font-size: 0.95rem; color: #b07890; margin-bottom: 25px;
  }
  #notify-close-btn {
    background: linear-gradient(180deg, #FFD1E0, #FFB6C8); color: #fff; border: 2px solid #fff;
    border-radius: 999px; padding: 10px 30px; font-size: 1rem;
    box-shadow: 0 4px 12px rgba(230, 122, 122, 0.3);
    cursor: pointer; transition: all 0.2s ease;
  }
  #notify-close-btn:hover { transform: translateY(-2px) scale(1.03); }

  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #FFB6C8; border-radius: 4px; }
</style>

<body class="min-h-screen p-3 md:p-6">
<div class="max-w-4xl mx-auto notebook">
  <div class="tape strawberry">专属菜单 ♡</div>
  <h1 class="text-4xl md:text-5xl text-center heart-title mt-3 mb-2">杨梅的专属菜单</h1>
  <p class="text-center text-sm mb-5" style="color:#b07890">所有数据云端实时同步，你选的我都能看见 💕</p>
  
  <div class="flex flex-wrap gap-2 justify-center mb-6">
    <button class="tab-btn active" id="tab-order" onclick="switchTab('order')">🛒 点餐台</button>
    <button class="tab-btn" id="tab-random" onclick="switchTab('random')">🎲 随机点单</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">📜 点单列表</button>
    <button class="tab-btn" id="tab-library" onclick="switchTab('library')">📖 菜谱库</button>
  </div>

  <!-- 点餐台 -->
  <div id="page-order" class="page">
    <div class="tape-card mb-4">
      <div class="tape peach">🛒 双人共享点餐台</div>
      <div class="text-sm mt-2 mb-3" style="color:#b07890">🍰 两人共享同一购物车，加减菜品实时同步！</div>
      
      <div class="flex flex-wrap gap-2 mb-4" id="orderFilterContainer">
        <button class="filter-btn active" onclick="filterOrderCate('全部', this)">全部</button>
        <button class="filter-btn" onclick="filterOrderCate('荤菜', this)">荤菜</button>
        <button class="filter-btn" onclick="filterOrderCate('素菜', this)">素菜</button>
        <button class="filter-btn" onclick="filterOrderCate('汤品', this)">汤品</button>
        <button class="filter-btn" onclick="filterOrderCate('主食', this)">主食</button>
        <button class="filter-btn" onclick="filterOrderCate('甜品', this)">甜品</button>
        <button class="filter-btn" onclick="filterOrderCate('酒水', this)">酒水</button>
      </div>

      <div id="orderList" class="grid gap-3 max-h-[420px] overflow-y-auto pr-1">
        <div class="loading-text">正在加载菜单...</div>
      </div>
      
      <div class="mt-5">
        <label class="text-sm">给大厨的备注：</label>
        <input id="orderNote" placeholder="输入备注会自动同步到对方屏幕哦..." oninput="debouncedSyncCart()" onfocus="isEditingNote = true" onblur="isEditingNote = false">
      </div>
      <div class="mt-4 flex flex-wrap gap-2">
        <button class="btn-cute" onclick="generateOrder()">📝 生成点餐单</button>
        <button class="btn-pink" onclick="clearOrder()">🗑 清空重选</button>
      </div>
    </div>
    <div class="hand-border">
      <h3 class="text-xl heart-title mb-2">📋 点餐单预览</h3>
      <div id="orderPreview"><p style="color:#b07890">还没有点菜，去上面选几道吧～</p></div>
      <button id="copyOrderBtn" class="btn-soft mt-4 hidden" onclick="copyOrderText()">📋 复制点餐单</button>
    </div>
  </div>

  <!-- 随机点菜 -->
  <div id="page-random" class="page hidden">
    <div class="tape-card">
      <div class="tape strawberry">今天吃什么？交给幸运签</div>
      <div class="mt-3 text-sm" style="color:#b07890">选一个数量，我来帮你随机抽菜啦 ✨</div>
      <div class="mt-4 flex flex-wrap items-center gap-3">
        <label>抽取数量：</label>
        <input id="randNum" type="number" value="3" min="1" max="12" style="width:90px">
        <button class="btn-cute" onclick="pickRandom()">🎲 开始随机点单</button>
      </div>
      <div id="randResult" class="mt-5"></div>
      
      <div id="randomSubmitArea" class="mt-4 hidden text-center">
         <button class="btn-cute w-full md:w-auto" id="randomSubmitBtn" onclick="submitRandomOrder()">💖 确认提交这份点餐单</button>
      </div>
    </div>
  </div>

  <!-- 点单历史 -->
  <div id="page-history" class="page hidden">
    <div class="tape-card mb-4">
      <div class="tape lemon">📜 历史点单记录</div>
      <div class="tip-bubble mt-3 mb-4 text-sm">这里记录了你们点过的所有菜单，双端实时同步～</div>
      <div id="historyList" class="grid gap-3 max-h-[500px] overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- 菜谱库 -->
  <div id="page-library" class="page hidden">
    <div class="tape-card mb-5">
      <div class="tape lemon">添加一道爱吃的菜</div>
      <input type="hidden" id="editId">
      <div class="grid md:grid-cols-2 gap-4 mt-4">
        <div><label class="text-sm">菜名 ♡</label><input id="rname" placeholder="比如：番茄炒蛋"></div>
        <div>
          <label class="text-sm">分类</label>
          <select id="rcate">
            <option value="荤菜">荤菜</option>
            <option value="素菜">素菜</option>
            <option value="汤品">汤品</option>
            <option value="主食">主食</option>
            <option value="甜品">甜品</option>
            <option value="酒水">酒水</option>
          </select>
        </div>
        <div>
          <label class="text-sm">难度</label>
          <select id="rdiff">
            <option value="简单">简单</option>
            <option value="中等">中等</option>
            <option value="困难">困难</option>
          </select>
        </div>
        <div>
          <label class="text-sm">上传图片</label>
          <div class="upload-btn-wrapper">
            <button class="upload-btn">📷 点击选择图片</button>
            <input type="file" id="rimg-file" accept="image/*" onchange="uploadImage()">
          </div>
          <input type="hidden" id="rimg">
          <p id="upload-status" class="text-xs mt-2 font-bold"></p>
          <img id="rimg-preview" class="mt-2 rounded hidden" style="max-height:100px; border:2px solid #FFD1E0;">
          <p class="text-xs mt-2" style="color:#b07890;">或者手动粘贴图片链接：</p>
          <input id="rimg-url" placeholder="https://..." oninput="document.getElementById('rimg').value = this.value">
        </div>
      </div>
      
      <div class="mt-5 flex flex-wrap gap-3">
        <button class="btn-cute" id="save-recipe-btn" onclick="saveRecipe()">💾 保存菜谱</button>
        <button class="btn-soft" onclick="clearForm()">🧹 清空表单</button>
      </div>
      <p id="db-status" class="text-xs mt-2 text-red-400"></p>
    </div>
    
    <div class="flex flex-wrap gap-2 mb-4">
      <span class="text-sm pt-1" style="color:#b07890">分类筛选：</span>
      <button class="filter-btn active" onclick="filterCate('全部', this)">全部</button>
      <button class="filter-btn" onclick="filterCate('荤菜', this)">荤菜</button>
      <button class="filter-btn" onclick="filterCate('素菜', this)">素菜</button>
      <button class="filter-btn" onclick="filterCate('汤品', this)">汤品</button>
      <button class="filter-btn" onclick="filterCate('主食', this)">主食</button>
      <button class="filter-btn" onclick="filterCate('甜品', this)">甜品</button>
      <button class="filter-btn" onclick="filterCate('酒水', this)">酒水</button>
    </div>
    <div id="recipeList" class="grid md:grid-cols-2 gap-4"></div>
  </div>
</div>

<!-- 昵称设置弹框 (首次进入) -->
<div id="name-modal">
  <div id="name-content">
    <h2 class="text-2xl heart-title mb-2">欢迎来到专属菜单 💕</h2>
    <p class="text-sm mb-4" style="color:#b07890">请告诉我你的昵称，以后点单就能认出你啦～</p>
    <input id="name-input" placeholder="比如：杨梅、大厨..." class="mb-4" maxlength="10">
    <button class="btn-cute w-full" onclick="saveName()">开启美味之旅 💖</button>
  </div>
</div>

<!-- 全屏精美居中 Toast (自己操作时) -->
<div id="toast-modal" onclick="hideModalToast()">
  <div id="toast-content">
    <span id="toast-icon">💕</span>
    <div id="toast-message">加载中...</div>
  </div>
</div>

<!-- 对方点单时的提醒弹框 (手动关闭) -->
<div id="notify-modal">
  <div id="notify-content">
    <span id="notify-icon">💌</span>
    <div id="notify-message">对方点单啦！</div>
    <div id="notify-sub">快去点餐台看看吧～</div>
    <button id="notify-close-btn" onclick="closeNotifyModal()">知道啦 💕</button>
  </div>
</div>

// ============ 昵称相关 ============
function checkUserName() {

// ============ 弹框通用方法 ============
function showToast(message, icon = "💕") {
  const modal = document.getElementById("toast-modal");
  const msgEl = document.getElementById("toast-message");
  const iconEl = document.getElementById("toast-icon");
  msgEl.innerText = message;
  iconEl.innerText = icon;
  modal.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => { modal.classList.remove("show"); }, 3000);
}

function hideModalToast() {
  document.getElementById("toast-modal").classList.remove("show");
  clearTimeout(window.toastTimer);
}

function showNotifyModal(message, subText) {
  const msgEl = document.getElementById("notify-message");
  const subEl = document.getElementById("notify-sub");
  msgEl.innerText = message;
  subEl.innerText = subText || "快去点餐台看看吧～";
  document.getElementById("notify-modal").classList.add("show");
}

function closeNotifyModal() {
  document.getElementById("notify-modal").classList.remove("show");
}

// ============ 排序 ============
function sortRecipes(list) {
  return list.sort((a, b) => {
    const indexA = CATE_ORDER.indexOf(a.cate);
    const indexB = CATE_ORDER.indexOf(b.cate);
    if (indexA === indexB) return b.id - a.id;
    return indexA - indexB;
  });
}

// ============ 核心数据拉取 ============
async function loadAllData(retryCount = 0) {
  try {
    const { data: recipeData, error: recipeErr } = await supabaseClient.from('recipes').select('*');
    if (recipeErr) throw recipeErr;
    recipes = recipeData || [];
    
    renderRecipeList();
    renderOrderList();
    
    const { data: cartData, error: cartErr } = await supabaseClient.from('cart').select('*').eq('id', 1).single();
    if (cartErr) throw cartErr;
    cart = cartData || { items: [], note: '' };
    
    if (!isEditingNote) {
      document.getElementById("orderNote").value = cart.note || '';
    }

    renderOrderList();
    renderOrderPreview();
    
    if (!isCheckingUnread) {
      isCheckingUnread = true;
      await checkUnreadNotifications();
    }
    
    initRealtime();
    
  } catch (e) {
    console.error("加载数据失败", e);
    if (retryCount < 1) {
      document.getElementById("orderList").innerHTML = '<div class="loading-text">正在唤醒数据库，请稍候...</div>';
      setTimeout(() => loadAllData(retryCount + 1), 2000);
    } else {
      document.getElementById("orderList").innerHTML = '<div class="loading-text">😥 加载失败，请检查网络后刷新页面重试</div>';
      document.getElementById("db-status").innerText = "⚠️ 云端读取失败，请检查网络或数据库配置";
    }
  }
}

// ============ 检查未读点单提醒（离线补偿） ============
async function checkUnreadNotifications() {
  try {
    // 查询最近一条未读，且点单人不是我（按昵称比对）的记录
    const { data: unreadData, error } = await supabaseClient
      .from('daily_menu')
      .select('*')
      .eq('is_read', false)
      .neq('orderer', currentUserName)
      .order('order_time', { ascending: false })
      .limit(1);

    if (error) throw error;

    if (unreadData && unreadData.length > 0) {
      const record = unreadData[0];
      const randomMsg = partnerNotifyQuotes[Math.floor(Math.random() * partnerNotifyQuotes.length)];
      showNotifyModal(`${record.orderer} ${randomMsg}`, "Ta 在你不在的时候点了一份菜单～");
      
      // 标记为已读
      await supabaseClient
        .from('daily_menu')
        .update({ is_read: true })
        .eq('id', record.id);
    }
  } catch (e) {
    console.error("检查未读消息失败", e);
  }
}

// ============ 获取历史总数 ============
async function getOrderCount() {
  const { count, error } = await supabaseClient
    .from('daily_menu')
    .select('*', { count: 'exact', head: true });
  if (error) return 0;
  return count || 0;
}

// ============ Realtime 实时同步 ============
function initRealtime() {
  supabaseClient
    .channel('schema-db-changes')
    .on(
      'postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'cart', filter: 'id=eq.1' },
      (payload) => {
        cart = payload.new;
        if (!isEditingNote) {
          document.getElementById("orderNote").value = cart.note || '';
        }
        renderOrderList();
        renderOrderPreview();
      }
    )
    .on(
      'postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'daily_menu' },
      async (payload) => {
        if (!document.getElementById("page-history").classList.contains("hidden")) {
          renderHistoryList();
        }

        const newRecord = payload.new;

        // 关键：如果点单人昵称和我一样，说明是我自己点的，不提醒自己
        if (newRecord.orderer === currentUserName) return;

        // 对方点单，实时弹窗
        const randomMsg = partnerNotifyQuotes[Math.floor(Math.random() * partnerNotifyQuotes.length)];
        showNotifyModal(`${newRecord.orderer} ${randomMsg}`, "快去点餐台看看吧～");
        
        // 实时提醒后，标记为已读（避免下次打开再弹）
        await supabaseClient
          .from('daily_menu')
          .update({ is_read: true })
          .eq('id', newRecord.id);
      }
    )
    .subscribe();
}

// ============ 菜谱库操作 ============
async function uploadImage() {
  const fileInput = document.getElementById("rimg-file");
  const file = fileInput.files[0];
  if (!file) return;

  const preview = document.getElementById("rimg-preview");
  const status = document.getElementById("upload-status");
  const saveBtn = document.getElementById("save-recipe-btn");
  
  preview.src = URL.createObjectURL(file);
  preview.classList.remove("hidden");

  isUploading = true;
  saveBtn.disabled = true;
  saveBtn.innerText = "⏳ 图片上传中...";
  status.innerText = "⏳ 正在上传图片到云端...";
  status.className = "text-xs mt-2 font-bold text-blue-500";

  try {
    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
    const { error } = await supabaseClient.storage.from('recipe-images').upload(fileName, file);
    if (error) throw error;
    const { data: urlData } = supabaseClient.storage.from('recipe-images').getPublicUrl(fileName);
    document.getElementById("rimg").value = urlData.publicUrl;
    document.getElementById("rimg-url").value = urlData.publicUrl;
    status.innerText = "✅ 图片上传成功！";
    status.className = "text-xs mt-2 font-bold text-green-500";
  } catch (err) {
    status.innerText = "❌ 上传失败：" + err.message;
    status.className = "text-xs mt-2 font-bold text-red-400";
  } finally {
    isUploading = false;
    saveBtn.disabled = false;
    saveBtn.innerText = "💾 保存菜谱";
  }
}

async function saveRecipe(){
  if (isUploading) { showToast("图片还在上传中，请稍等哦～"); return; }
  const name = document.getElementById("rname").value.trim();
  if(!name){ showToast("菜名不能为空哦 😳"); return; }
  
  const payload = {
    name: name,
    cate: document.getElementById("rcate").value,
    diff: document.getElementById("rdiff").value,
    img: document.getElementById("rimg").value
  };

  if (editDocId) {
    const { error } = await supabaseClient.from('recipes').update(payload).eq('id', editDocId);
    if(error) { showToast("云端更新失败"); return; }
  } else {
    const { error } = await supabaseClient.from('recipes').insert([payload]);
    if(error) { showToast("云端保存失败"); return; }
  }
  
  showToast("已保存到云端啦 💗", "🎉");
  editDocId = null;
  clearForm();
  loadAllData();
}

function renderOrderList(){

  wrap.innerHTML = "";

    wrap.innerHTML = '<p class="text-center text-sm" style="color:#b07890">这个分类下还没有菜品哦～</p>'; 
    return; 
  }

  list.forEach(r=>{

    const div = document.createElement("div");
    div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#fff; border:2px dashed #FFD1E0; border-radius:12px; padding:10px 12px;";
    div.innerHTML = `

        <div class="qty-btn" onclick="changeQty(${r.id}, 1)">+</div>
      </div>
    `;
    wrap.appendChild(div);
  });
}

function changeQty(id, delta){
  let item = cart.items.find(i => i.id === id);
  if(!item) { item = { id: id, qty: 0 }; cart.items.push(item); }
  item.qty += delta;
  if(item.qty <= 0) cart.items = cart.items.filter(i => i.id !== id);
  
  renderOrderList();
  renderOrderPreview();
  debouncedSyncCart();
}

function debouncedSyncCart() {
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(async () => {
    cart.note = document.getElementById("orderNote").value;
    const { error } = await supabaseClient.from('cart').update({
      items: cart.items,
      note: cart.note,
      updated_at: new Date().toISOString()
    }).eq('id', 1);
    if(error) console.error("购物车同步失败", error);
  }, 500);
}

function renderOrderPreview(){
  const preview = document.getElementById("orderPreview");
  const copyBtn = document.getElementById("copyOrderBtn");
  const note = document.getElementById("orderNote").value;
  
  const items = cart.items.map(i => {
    const r = recipes.find(x => x.id == i.id);
    return r ? `${r.name} x${i.qty}` : null;
  }).filter(Boolean);

  if(items.length === 0){
    preview.innerHTML = `<p style="color:#b07890">还没有点菜，去上面选几道吧～</p>`;
    copyBtn.classList.add('hidden');
    return;
  }

  let html = `<div class="text-lg heart-title mb-2">🍽️ 你的点餐单</div>`;
  items.forEach(item => { html += `<div class="mb-1">♡ ${item}</div>`; });
  if(note){ html += `<div class="mt-2 text-sm" style="color:#b07890">📝 备注：${note}</div>`; }
  html += `<div class="text-sm mt-3" style="color:#b07890">大厨，今天就拜托你啦！💕</div>`;
  
  preview.innerHTML = html;
  copyBtn.classList.remove('hidden');
}

async function generateOrder(){
  if(cart.items.length === 0) { showToast("还没有点菜哦，去上面选几道吧～"); return; }
  
  const totalCount = await getOrderCount();
  
  if (totalCount > 0 && totalCount % 10 === 0) {
    const msg = `你们已经一起点了 ${totalCount} 顿饭啦！要继续好好吃饭，一直在一起哦 💕`;
    showToast(msg, "🎉");
  } else {
    const q = selfConfirmQuotes[Math.floor(Math.random() * selfConfirmQuotes.length)];
    showToast(q);
  }

  const note = document.getElementById("orderNote").value.trim();
  const snapshot = cart.items.map(i => {
    const r = recipes.find(x => x.id == i.id);
    return r ? { id: r.id, name: r.name, img: r.img, cate: r.cate, qty: i.qty } : null;
  }).filter(Boolean);

  await supabaseClient.from('daily_menu').insert([{ 
    note: note, 
    items: snapshot, 
    orderer: currentUserName, 
    is_read: false 
  }]);
  
  await supabaseClient.from('cart').update({ items: [], note: '', updated_at: new Date().toISOString() }).eq('id', 1);
  
  cart.items = [];
  document.getElementById("orderNote").value = '';
  renderOrderList();
  renderOrderPreview();
  loadAllData();
  document.getElementById("orderPreview").scrollIntoView({behavior:"smooth"});
}

// ============ 随机点菜 ============
function pickRandom(){
  const num = Number(document.getElementById("randNum").value);
  const wrap = document.getElementById("randResult");
  
  const eligible = recipes.filter(r => ['荤菜', '素菜', '汤品'].includes(r.cate));
  if(eligible.length === 0){ 
    wrap.innerHTML = `<p>没有可供随机的主菜，先去添加一些荤素菜吧～</p>`; 
    document.getElementById("randomSubmitArea").classList.add("hidden");
    currentRandomResult = null;
    return; 
  }

  const meats = eligible.filter(r => r.cate === '荤菜');
  const veggies = eligible.filter(r => r.cate === '素菜');
  const soups = eligible.filter(r => r.cate === '汤品');
  const shuffle = (array) => array.sort(() => Math.random() - 0.5);

  let meatCount = Math.round(num * 2 / 3);
  let vegCount = num - meatCount;

  let result = [];
  let shuffledMeats = shuffle([...meats]);
  let selectedMeats = shuffledMeats.slice(0, meatCount);
  result.push(...selectedMeats);
  
  let shuffledVeggies = shuffle([...veggies]);
  let selectedVeggies = shuffledVeggies.slice(0, vegCount);
  result.push(...selectedVeggies);

  if(result.length < num) {
    let remainingMeats = shuffledMeats.slice(selectedMeats.length);
    if(remainingMeats.length >= (num - result.length)) {
        result.push(...remainingMeats.slice(0, num - result.length));
    } else {
        result.push(...remainingMeats);
        let remainingVeggies = shuffledVeggies.slice(selectedVeggies.length);
        result.push(...remainingVeggies.slice(0, num - result.length));
    }
  } else if (result.length > num) {
     result = result.slice(0, num);
  }

  if(soups.length > 0 && Math.random() > 0.5) {
      const randomSoup = soups[Math.floor(Math.random() * soups.length)];
      result.push(randomSoup);
  }

  result = shuffle(result);
  currentRandomResult = result;

  let html = `<div class="hand-border"><div class="text-lg heart-title mb-3">🎲 今日幸运菜单</div>`;
  result.forEach((r,i)=>{
    html += `<div class="mb-2">${i+1}. ${r.name} <span class="sticker-tag ${r.cate === '汤品' ? 'sweet' : 'peach'}" style="font-size:12px">${r.cate}</span></div>`;
  });
  html += `<div class="text-sm mt-3" style="color:#b07890">是不是爱吃的那几道呢？💕</div></div>`;
  wrap.innerHTML = html;
  
  document.getElementById("randomSubmitArea").classList.remove("hidden");
}

async function submitRandomOrder(){
  if(!currentRandomResult || currentRandomResult.length === 0) return;
  
  const totalCount = await getOrderCount();
  
  if (totalCount > 0 && totalCount % 10 === 0) {
    const msg = `你们已经一起点了 ${totalCount} 顿饭啦！要继续好好吃饭，一直在一起哦 💕`;
    showToast(msg, "🎉");
  } else {
    const q = selfConfirmQuotes[Math.floor(Math.random() * selfConfirmQuotes.length)];
    showToast(q);
  }

  const note = "（随机点单）" + (document.getElementById("orderNote").value.trim() || "");
  
  const snapshot = currentRandomResult.map(r => {
    return { id: r.id, name: r.name, img: r.img, cate: r.cate, qty: 1 };
  });

  await supabaseClient.from('daily_menu').insert([{ 
    note: note, 
    items: snapshot, 
    orderer: currentUserName, 
    is_read: false 
  }]);
  
  document.getElementById("randResult").innerHTML = "";
  document.getElementById("randomSubmitArea").classList.add("hidden");
  currentRandomResult = null;
  
  setTimeout(() => { switchTab('history'); }, 3000);
}

// ============ UI 交互 ============
function switchTab(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
  document.getElementById("page-"+name).classList.remove("hidden");
  document.querySelectorAll(".tab-btn").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active");
  
  if(name==="order") { renderOrderList(); }
  if(name==="random") { 
    document.getElementById("randResult").innerHTML = ''; 
    document.getElementById("randomSubmitArea").classList.add("hidden"); 
    currentRandomResult = null; 
  }
  if(name==="history") renderHistoryList();
  if(name==="library") renderRecipeList();
}

function renderAll(){
  renderRecipeList();
  renderOrderList();
  renderOrderPreview();
}

window.switchTab = switchTab;
window.saveRecipe = saveRecipe;
window.clearForm = clearForm;
window.filterCate = filterCate;
window.filterOrderCate = filterOrderCate;
window.editRecipe = editRecipe;
window.delRecipe = delRecipe;
window.changeQty = changeQty;
window.debouncedSyncCart = debouncedSyncCart;
window.generateOrder = generateOrder;
window.clearOrder = clearOrder;
window.copyOrderText = copyOrderText;
window.pickRandom = pickRandom;
window.submitRandomOrder = submitRandomOrder;
window.uploadImage = uploadImage;
window.hideModalToast = hideModalToast;
window.closeNotifyModal = closeNotifyModal;
window.saveName = saveName;

window.onload = () => {
  checkUserName();
  loadAllData();
};
</script>
